<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <title>ETA 비교</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>ETA 비교</h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="main" role="tab">조회</button>
      <button class="tab" data-view="log" role="tab">기록</button>
    </nav>
    <button id="btn-token" class="icon-btn" aria-label="접근 토큰 설정" title="접근 토큰 설정">⚙</button>
  </header>

  <div id="inapp-notice" class="notice warn" hidden>
    인앱 브라우저에서는 내비 앱이 열리지 않을 수 있습니다. 메뉴에서 <b>다른 브라우저로 열기</b>를 선택하세요.
  </div>

  <section id="trip" class="trip" hidden>
    <div class="trip-text">
      <span class="trip-label">운행 중</span>
      <strong id="trip-dest"></strong>
      <span id="trip-meta" class="muted"></span>
    </div>
    <div class="trip-actions">
      <button id="btn-arrive" class="btn primary">도착</button>
      <button id="btn-trip-cancel" class="btn ghost">취소</button>
    </div>
  </section>

  <main id="view-main">
    <section class="block">
      <div class="row">
        <div>
          <div class="label">출발지</div>
          <div id="origin-text">현재 위치 확인 중…</div>
        </div>
        <button id="btn-locate" class="btn ghost small">다시 찾기</button>
      </div>
    </section>

    <section class="block">
      <div class="label">목적지</div>
      <form id="search-form" class="search" autocomplete="off">
        <input id="search-input" type="search" enterkeyhint="search" placeholder="장소, 주소 검색" maxlength="60">
        <button class="btn primary" type="submit">검색</button>
      </form>
      <ul id="search-results" class="results" hidden></ul>
      <div id="dest" class="dest" hidden>
        <div>
          <strong id="dest-name"></strong>
          <div id="dest-addr" class="muted small-text"></div>
        </div>
        <button id="btn-dest-clear" class="btn ghost small">변경</button>
      </div>
    </section>

    <section id="eta-block" class="block" hidden>
      <div class="row">
        <div class="label">추천 경로 기준</div>
        <button id="btn-refresh" class="btn ghost small">새로고침</button>
      </div>
      <div id="eta-age" class="muted small-text"></div>
      <div id="cards" class="cards"></div>
      <p class="muted small-text">카드를 누르면 해당 앱이 목적지로 실행됩니다. 앱이 경로를 다시 계산하므로 시간이 조금 다를 수 있습니다.</p>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>

  <main id="view-log" hidden>
    <section class="block">
      <div class="row">
        <div class="label">운행 기록 <span id="log-count" class="muted"></span></div>
        <div class="row-gap">
          <button id="btn-export" class="btn ghost small">CSV</button>
          <button id="btn-clear-log" class="btn ghost small danger">전체 삭제</button>
        </div>
      </div>
      <div id="log-summary" class="summary"></div>
      <ul id="log-list" class="log-list"></ul>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
