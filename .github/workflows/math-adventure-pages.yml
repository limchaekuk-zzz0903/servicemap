name: math-adventure → GitHub Pages

# Tests the app on every push and pull request that touches it,
# and publishes it to GitHub Pages when main changes.
on:
  push:
    branches: [main]
    paths:
      - 'math-adventure/**'
      - '.github/workflows/math-adventure-pages.yml'
  pull_request:
    paths:
      - 'math-adventure/**'
      - '.github/workflows/math-adventure-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-adventure-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: math-adventure/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run end-to-end checks
        run: npm test

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cd math-adventure
          cp index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png ../_site/
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" ../_site/sw.js
          touch ../_site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
